networks:
  vitals-network:
    driver: bridge
services:
  osm:
    image: vitals/osm-tile-server:latest
    container_name: vitals-osm-server
    ports:
      - "8080:80"
      - "5432:5432"
    networks:
      - vitals-network
    environment:
      THREADS: 24
      OSM2PGSQL_EXTRA_ARGS: "-C 24000"
      BACKGROUND_RENDERING: "true"
      POSTGRES_USER: renderer
      POSTGRES_PASSWORD: renderer
    volumes:
      - osm-data:/data/database
      - osm-tiles:/data/tiles
    shm_size: "8gb"
    command: run
  agent-b:
    image: vitals/agent-b:latest
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - VITALS_SCHEMA_ROOT=/app/schemas
    ports:
      - "8081:8081"
    networks:
      - vitals-network 

volumes:
  osm-data:
  osm-tiles: